[package]
name = "typst-bpmn"
version = "0.14.1"
entrypoint = "src/lib.typ"
authors = ["Sam Dinh <25410291@ms.uit.edu.vn>"]
license = "MIT"
description = "Business process diagrams in Typst: BPMN 2.0 collaborations from BPMNDI, plus step flows, process maps, org charts and analysis overlays. Pure Typst — no cetz, no fletcher, no packages."
repository = "https://github.com/sam-uit/typst-bpmn"
categories = ["visualization"]
keywords = ["bpmn", "process", "diagram", "flowchart", "orgchart"]
compiler = "0.15.0"

exclude = ["tests", "docs", "samples", "models", "examples", "out", "demo.typ", "plan.md", "justfile"]
